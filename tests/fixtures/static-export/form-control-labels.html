<!doctype html>
<html lang="en">
  <head>
    <title>Labeled form controls fixture</title>
  </head>
  <body>
    <label>
      Email
      <input type="email" />
    </label>
    <label for="region">Region</label>
    <select id="region">
      <option>North</option>
    </select>
    <label>
      Notes
      <textarea></textarea>
    </label>
  </body>
</html>
