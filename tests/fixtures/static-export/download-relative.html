<!doctype html>
<html lang="en">
  <head>
    <title>Relative downloads</title>
  </head>
  <body>
    <a download href="./reports/store-summary.csv">Download report</a>
    <map name="report-map">
      <area
        alt="Download inventory report"
        download="inventory.csv"
        href="/reports/inventory.csv"
        shape="rect"
        coords="0,0,100,100"
      />
    </map>
  </body>
</html>
